name: astra_dart
description: A modern, type-safe web framework for Dart inspired by FastAPI. Features include dependency injection, auto-generated OpenAPI docs, and generic controllers.
version: 1.0.0
repository: https://github.com/astradart/astra

environment:
  sdk: ^3.10.4

# Add regular dependencies here.
dependencies:
  analyzer: ^9.0.0
  args: ^2.7.0
  build: ^4.0.3
  meta: ^1.10.0
  shelf: ^1.4.0
  source_gen: ^4.1.1
  watcher: ^1.2.1
  # Modules
  dart_jsonwebtoken: ^2.12.0
  logging: ^1.2.0
  
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  mason_logger: ^0.3.3
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.24.0
  lints: ^6.0.0
  test: ^1.25.6
