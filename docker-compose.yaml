version: '3.8'

services:
  # The Astra Application
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=astra_todo
      - DB_USER=postgres
      - DB_PASS=password
    depends_on:
      - db
    restart: unless-stopped

  # The Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=astra_todo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
